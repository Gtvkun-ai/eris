 Sans',Arial,sans-serif" font-size="15" font-weight="400" fill="#8fb0ab" text-anchor="start" opacity="1" xml:space="preserve">Nhớ lại, nghĩ thêm, ghi chú không bao giờ thành lời nói.</text><text x="760" y="182" font-family="'Segoe UI','Noto Sans',Arial,sans-serif" font-size="14" font-weight="800" fill="#5fd6c4" text-anchor="start" opacity="1" letter-spacing="2" xml:space="preserve">BA PHANH</text><rect x="760" y="196" width="464" height="100" rx="14" fill="#102a36" stroke="#1d3a44" stroke-width="1.5" opacity="1"/><text x="790" y="270" font-family="'Segoe UI','Noto Sans',Arial,sans-serif" font-size="64" font-weight="800" fill="#5fd6c4" text-anchor="start" opacity="1" xml:space="preserve">12</text><text x="870" y="240" font-family="'Segoe UI','Noto Sans',Arial,sans-serif" font-size="18" font-weight="700" fill="#e9f3f1" text-anchor="start" opacity="1" xml:space="preserve">bước tối đa</text><text x="870" y="266" font-family="'Segoe UI','Noto Sans',Arial,sans-serif" font-size="14" font-weight="400" fill="#8fb0ab" text-anchor="start" opacity="1" xml:space="preserve">trần cứng: mặc định 8, tối thiểu 2</text><rect x="760" y="308" width="464" height="100" rx="14" fill="#102a36" stroke="#1d3a44" stroke-width="1.5" opacity="1"/><text x="790" y="382" font-family="'Segoe UI','Noto Sans',Arial,sans-serif" font-size="64" font-weight="800" fill="#f2b353" text-anchor="start" opacity="1" xml:space="preserve">2</text><text x="870" y="352" font-family="'Segoe UI','Noto Sans',Arial,sans-serif" font-size="18" font-weight="700" fill="#e9f3f1" text-anchor="start" opacity="1" xml:space="preserve">bước liền không tiến triển → dừng</text><text x="870" y="378" font-family="'Segoe UI','Noto Sans',Arial,sans-serif" font-size="14" font-weight="400" fill="#8fb0ab" text-anchor="start" opacity="1" xml:space="preserve">trùng · rỗng · lỗi · hết hạn mức</text><rect x="760" y="420" width="464" height="100" rx="14" fill="#102a36" stroke="#1d3a44" stroke-width="1.5" opacity="1"/><text x="790" y="494" font