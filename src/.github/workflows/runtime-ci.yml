name: runtime-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q actions core cortex domain llm memory runtime screen settings telemetry transport tests tools
      - name: Architecture budgets
        run: python tools/check_architecture.py
      - name: Exception budget
        run: python tools/audit_exception_boundaries.py --check
      - name: Release manifest
        run: python tools/check_release_manifest.py
      - name: Tests and runtime coverage budget
        run: python -m pytest --cov=runtime --cov-branch --cov-report=term --cov-fail-under=36.0 -q
