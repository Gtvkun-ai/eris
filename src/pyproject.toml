[project]
name = "eris-runtime-source"
version = "0.80.0"
description = "AI-orchestrated companion runtime with long-lived engagement support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "psutil>=5.9",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "actions*", "config*", "core*", "cortex*", "domain*", "llm*",
  "memory*", "models*", "parser_grounding*", "runtime*", "screen*",
  "settings*", "telemetry*", "transport*", "experiments*", "tools*",
]
exclude = ["tests*", "assets*", "live2d_body*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["assets", "live2d_body"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["runtime", "cortex.subject", "memory.subject", "experiments.emergence"]
omit = ["tests/*", "assets/*", "live2d_body/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 37.0
